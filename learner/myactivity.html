<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Activity | Learner Project Tracker</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <h1>Learner Project Tracker</h1>
  </header>

  <div class="layout">
    <main class="content">
      <h2>My Activity</h2>

      <section class="card" aria-labelledby="requirements-heading">
        <h3 id="requirements-heading">Day 3 requirements</h3>
        <p>Submit a link to your project work for today. Include a one-sentence description of what you did.</p>
      </section>

      <section class="card" aria-labelledby="submit-heading">
        <h3 id="submit-heading">Submit your work</h3>
        <form>
          <div class="field">
            <label for="day">Day</label>
            <select id="day" name="day">
              <option value="3" selected>Day 3</option>
              <option value="2">Day 2</option>
              <option value="1">Day 1</option>
            </select>
          </div>

          <div class="field">
            <label for="link">Project link</label>
            <input type="url" id="link" name="link" placeholder="Paste your link here" required>
          </div>

          <button type="submit" class="btn">Submit</button>
        </form>
      </section>
    </main>

    <nav class="site-nav" aria-label="Learner navigation">
      <ul>
        <li><a href="my-activity.html" aria-current="page">My Activity</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="overview.html">Overview</a></li>
      </ul>
    </nav>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Learner Project Tracker</p>
  </footer>
</body>
</html>
