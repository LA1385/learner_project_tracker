<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview | Learner Project Tracker</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <h1>Learner Project Tracker</h1>
  </header>

  <div class="layout">
    <main class="content">
      <h2>Overview</h2>

      <div class="card-grid">
        <section class="card">
          <table>
            <caption>Week 1</caption>
            <thead>
              <tr><th scope="col">Day</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th><th scope="col">4</th><th scope="col">5</th></tr>
            </thead>
            <tbody>
            <tr><th scope="row">Submitted</th><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td></tr>
            <tr><th scope="row">Reviewed</th><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td></tr>
            </tbody>
          </table>
        </section>

        <section class="card">
          <table>
            <caption>Week 2</caption>
            <thead>
              <tr><th scope="col">Day</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th><th scope="col">4</th><th scope="col">5</th></tr>
            </thead>
            <tbody>
            <tr><th scope="row">Submitted</th><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td></tr>
            <tr><th scope="row">Reviewed</th><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td><td class="yes">Yes</td><td class="no">No</td></tr>
            </tbody>
          </table>
        </section>

        <section class="card">
          <table>
            <caption>Week 3</caption>
            <thead>
              <tr><th scope="col">Day</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th><th scope="col">4</th><th scope="col">5</th></tr>
            </thead>
            <tbody>
            <tr><th scope="row">Submitted</th><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td><td class="no">No</td></tr>
            <tr><th scope="row">Reviewed</th><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td><td class="no">No</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>

    <nav class="site-nav" aria-label="Learner navigation">
      <ul>
        <li><a href="my-activity.html">My Activity</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="overview.html" aria-current="page">Overview</a></li>
      </ul>
    </nav>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Learner Project Tracker</p>
  </footer>
</body>
</html>
