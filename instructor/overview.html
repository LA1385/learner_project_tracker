<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview | Learner Project Tracker</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <h1>Learner Project Tracker</h1>
  </header>

  <div class="layout">
    <main class="content">
      <h2>Overview</h2>
      <form id="learner-form" novalidate>
        <h3>Register a learner</h3>

        <div>
          <label for="name">Name</label>
          <input type="text" id="name" required
            pattern="[\p{L}\p{M}'’ \-]{2,}" aria-describedby="name-error">
          <p class="error" id="name-error"></p>
        </div>

        <div>
          <label for="phone">Phone</label>
          <input type="tel" id="phone" required
           pattern="0[789][01]\d{8}" aria-describedby="phone-error">
          <p class="error" id="phone-error"></p>
        </div>

        <div>
          <label for="cohort">Cohort</label>
          <input type="text" id="cohort" required
            pattern="[A-Za-z0-9 \-]{2,20}" aria-describedby="cohort-error">
          <p class="error" id="cohort-error"></p>
        </div>

        <p id="form-success" role="status"></p>
        <button type="submit">Register learner</button>
      </form>
      <div class="card-grid"></div>
    </main>

    <nav class="site-nav" aria-label="Instructor navigation">
      <ul>
        <li><a href="review-queue.html">Review Queue</a></li>
        <li><a href="overview.html" aria-current="page">Overview</a></li>
      </ul>
    </nav>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Learner Project Tracker</p>
  </footer>

  <script type="module" src="overview.js"></script>
</body>
</html>
