<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Learner Project Tracker</title>
</head>
<body>
  <header>
    <h1>Learner Project Tracker</h1>
  </header>

  <main>
    <h2>Login</h2>

    <!-- Role routing (learner vs instructor) will be added with JavaScript later -->
    <form>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit">Log in</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Learner Project Tracker</p>
  </footer>
</body>
</html>
